<!DOCTYPE html>
<html lang="fr" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cavernium</title>
<meta name="description" content="Cavernium — jeu Roblox de minage. Explore 21 zones, des cailloux bruts jusqu'à l'Infinitium.">
<link rel="icon" type="image/png" href="assets/cavernium-favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050308;
    --bg-panel:#0b0714;
    --bg-panel-2:#100a1c;
    --line:rgba(180,150,255,0.14);
    --purple:#9b4bff;
    --purple-deep:#4a1f8f;
    --blue:#4fb3ff;
    --gold:#ffb347;
    --white-glow:#f3ecff;
    --text:#e9e3f7;
    --text-dim:#9c8fc0;
    --radius:2px;
    --serif: "Cinzel", serif;
    --sans: "Manrope", -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }
  a{color:inherit;}
  .hidden{display:none !important;}
  img{max-width:100%; display:block;}
  button{font:inherit;}

  /* ---------- Starfield background ---------- */
  .stars{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 70% 60%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1.5px 1.5px at 40% 80%, rgba(200,170,255,0.5), transparent),
      radial-gradient(1px 1px at 85% 15%, rgba(255,255,255,0.35), transparent),
      radial-gradient(1.5px 1.5px at 55% 45%, rgba(150,200,255,0.4), transparent),
      radial-gradient(1px 1px at 10% 65%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1px 1px at 92% 80%, rgba(255,200,150,0.35), transparent);
    background-size: 100% 100%;
    opacity:0.8;
  }

  /* ---------- Language gate ---------- */
  #lang-gate{
    position:fixed; inset:0; z-index:100;
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(ellipse at 50% 40%, rgba(107,47,179,0.35), transparent 60%),
      #030106;
    text-align:center;
    padding:24px;
  }
  .gate-inner{
    display:flex; flex-direction:column; align-items:center; gap:28px;
    max-width:420px;
  }
  .gate-logo{
    width:150px; height:150px; border-radius:50%;
    box-shadow: 0 0 60px rgba(155,75,255,0.45), 0 0 120px rgba(79,179,255,0.2);
  }
  .gate-title{
    font-family:var(--serif); font-weight:800; font-size:2.1rem;
    letter-spacing:0.06em;
    background: linear-gradient(90deg, var(--gold), var(--purple) 45%, var(--blue));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    margin:0;
  }
  .gate-sub{color:var(--text-dim); font-size:0.95rem; margin:0;}
  .gate-buttons{display:flex; gap:16px; flex-wrap:wrap; justify-content:center;}
  .gate-btn{
    font-family:var(--sans); font-weight:700; font-size:1rem;
    padding:14px 30px; border-radius:var(--radius);
    border:1px solid var(--line);
    background:rgba(20,12,35,0.6);
    color:var(--text);
    cursor:pointer;
    transition:border-color 0.2s, box-shadow 0.2s, transform 0.15s;
    display:flex; align-items:center; gap:10px;
  }
  .gate-btn:hover, .gate-btn:focus-visible{
    border-color:var(--purple);
    box-shadow:0 0 24px rgba(155,75,255,0.35);
    transform:translateY(-2px);
    outline:none;
  }
  .gate-flag{font-size:1.3rem;}

  /* ---------- Header ---------- */
  header{
    position:sticky; top:0; z-index:40;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 5vw;
    background:rgba(5,3,8,0.82);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    flex-wrap:wrap; gap:12px;
  }
  .brand{display:flex; align-items:center; gap:12px; text-decoration:none; background:none; border:none; cursor:pointer; padding:0; color:inherit;}
  .brand img{width:38px; height:38px; border-radius:50%;}
  .brand span{font-family:var(--serif); font-weight:700; font-size:1.15rem; letter-spacing:0.04em; color:var(--white-glow);}
  nav{display:flex; align-items:center; gap:22px;}
  .nav-links{display:flex; gap:6px;}
  .nav-btn{
    text-decoration:none; background:none; border:1px solid transparent; color:var(--text-dim);
    font-size:0.92rem; font-weight:700; cursor:pointer; padding:8px 14px; border-radius:var(--radius);
    transition:color 0.2s, border-color 0.2s, background 0.2s;
  }
  .nav-btn:hover{color:var(--white-glow);}
  .nav-btn.active{color:var(--white-glow); border-color:var(--line); background:rgba(155,75,255,0.1);}
  #lang-toggle{
    border:1px solid var(--line); background:transparent; color:var(--text-dim);
    font-family:var(--sans); font-weight:700; font-size:0.85rem;
    padding:6px 12px; border-radius:var(--radius); cursor:pointer;
    transition:border-color 0.2s, color 0.2s;
  }
  #lang-toggle:hover{border-color:var(--blue); color:var(--white-glow);}
  @media (max-width:700px){
    .nav-links{display:none;}
  }

  /* ---------- Pages ---------- */
  .page{position:relative; z-index:1;}

  /* ---------- Hero ---------- */
  #hero{
    padding:100px 6vw 90px;
    display:grid; grid-template-columns: 1.1fr 0.9fr; gap:50px;
    align-items:center;
    max-width:1200px; margin:0 auto;
  }
  @media (max-width:860px){
    #hero{grid-template-columns:1fr; text-align:center; padding-top:60px;}
    #hero .hero-visual{order:-1; margin:0 auto;}
  }
  .eyebrow-free{color:var(--blue); font-weight:700; font-size:0.85rem; letter-spacing:0.04em; margin:0 0 14px;}
  h1.hero-title{
    font-family:var(--serif); font-weight:800; font-size:clamp(2.6rem, 5.5vw, 4.4rem);
    line-height:1.05; margin:0 0 22px; letter-spacing:0.01em;
    color:var(--white-glow);
  }
  .hero-title .accent{
    background:linear-gradient(90deg, var(--gold), var(--purple) 55%, var(--blue));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .hero-desc{font-size:1.08rem; color:var(--text-dim); max-width:52ch; margin:0 0 32px;}
  @media (max-width:860px){ .hero-desc{margin-left:auto; margin-right:auto;} }
  .hero-ctas{display:flex; gap:16px; flex-wrap:wrap;}
  @media (max-width:860px){ .hero-ctas{justify-content:center;} }
  .btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:13px 26px; border-radius:var(--radius); font-weight:700; font-size:0.95rem;
    text-decoration:none; cursor:pointer; border:1px solid transparent;
    transition:transform 0.15s, box-shadow 0.2s, border-color 0.2s;
  }
  .btn-primary{
    background:linear-gradient(90deg, #7a2fe0, #4fb3ff);
    color:#050308;
    box-shadow:0 0 30px rgba(122,47,224,0.35);
  }
  .btn-primary:hover{transform:translateY(-2px); box-shadow:0 0 40px rgba(122,47,224,0.55);}
  .btn-ghost{
    border-color:var(--line); color:var(--text); background:none;
  }
  .btn-ghost:hover{border-color:var(--blue); color:var(--white-glow);}
  .hero-visual{position:relative; display:flex; justify-content:center;}
  .hero-visual img{
    width:min(420px, 90%); border-radius:50%;
    box-shadow:0 0 90px rgba(155,75,255,0.4), 0 0 160px rgba(79,179,255,0.2);
  }

  /* ---------- Section shells ---------- */
  section{position:relative;}
  .section-inner{max-width:1100px; margin:0 auto; padding:70px 6vw;}
  .section-head{max-width:640px; margin-bottom:44px;}
  .section-head h2{
    font-family:var(--serif); font-weight:700; font-size:clamp(1.8rem, 3vw, 2.4rem);
    color:var(--white-glow); margin:0 0 14px;
  }
  .section-head p{color:var(--text-dim); margin:0; font-size:1.02rem;}
  .page-head{
    max-width:1100px; margin:0 auto; padding:60px 6vw 10px;
  }
  .page-head h1{
    font-family:var(--serif); font-weight:700; font-size:clamp(2rem, 3.6vw, 2.9rem);
    color:var(--white-glow); margin:0 0 12px;
  }
  .page-head p{color:var(--text-dim); margin:0; max-width:65ch; font-size:1.02rem;}

  /* ---------- About / stats ---------- */
  #about{border-top:1px solid var(--line);}
  .about-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:24px; margin-top:20px;}
  @media (max-width:700px){ .about-grid{grid-template-columns:1fr;} }
  .about-card{
    background:var(--bg-panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:26px;
  }
  .about-card .num{font-family:var(--serif); font-size:2rem; font-weight:700; color:var(--gold); display:block; margin-bottom:6px;}
  .about-card p{margin:0; color:var(--text-dim); font-size:0.95rem;}

  /* ---------- Notice banner (provisional data) ---------- */
  .notice{
    max-width:1100px; margin:0 auto; padding:0 6vw 30px;
  }
  .notice-inner{
    border:1px dashed rgba(255,179,71,0.4);
    background:rgba(255,179,71,0.06);
    border-radius:var(--radius);
    padding:14px 18px;
    color:var(--text-dim);
    font-size:0.88rem;
  }
  .notice-inner strong{color:var(--gold);}

  /* ---------- Zones path ---------- */
  .path{
    max-width:1100px; margin:0 auto; padding:10px 6vw 70px;
    position:relative;
    padding-left:calc(6vw + 26px);
  }
  .path::before{
    content:"";
    position:absolute; left:calc(6vw + 1px); top:6px; bottom:6px; width:2px;
    background:linear-gradient(180deg, #8a7660, #9b4bff 40%, #ffb347 70%, #ffe9a8);
    opacity:0.5;
  }
  .zone{
    position:relative;
    margin-bottom:14px;
    border:1px solid var(--line);
    background:var(--bg-panel);
    border-radius:var(--radius);
  }
  .zone::before{
    content:"";
    position:absolute; left:-26px; top:22px;
    width:12px; height:12px; border-radius:50%;
    background:var(--zone-color, var(--purple));
    box-shadow:0 0 12px var(--zone-color, var(--purple));
  }
  .zone-head{
    display:flex; align-items:center; gap:16px;
    width:100%; text-align:left;
    padding:18px 20px;
    background:none; border:none; cursor:pointer;
    color:var(--text); font-family:var(--sans);
  }
  .zone-num{
    font-family:var(--serif); font-weight:700; font-size:0.85rem;
    color:var(--zone-color, var(--purple));
    min-width:34px;
  }
  .zone-icon{font-size:1.3rem;}
  .zone-titles{flex:1; min-width:0;}
  .zone-name{font-weight:700; font-size:1.08rem; color:var(--white-glow); display:block;}
  .zone-theme{font-size:0.82rem; color:var(--text-dim); display:block; margin-top:2px;}
  .zone-chevron{
    color:var(--text-dim); font-size:1rem; transition:transform 0.2s;
    flex-shrink:0;
  }
  .zone.open .zone-chevron{transform:rotate(180deg);}
  .zone-body{
    max-height:0; overflow:hidden; transition:max-height 0.3s ease;
  }
  .zone.open .zone-body{max-height:900px;}
  .zone-items{
    display:grid; grid-template-columns:repeat(3,1fr); gap:10px;
    padding:0 20px 22px 20px;
    border-top:1px solid var(--line);
    padding-top:16px;
  }
  @media (max-width:700px){ .zone-items{grid-template-columns:1fr 1fr;} }
  @media (max-width:460px){ .zone-items{grid-template-columns:1fr;} }

  /* mineral clickable box */
  .mineral{
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--bg-panel-2);
    overflow:hidden;
  }
  .mineral-btn{
    width:100%; text-align:left; background:none; border:none; cursor:pointer;
    color:var(--text); padding:10px 12px; font-size:0.9rem; font-weight:600;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  .mineral-btn::after{
    content:"+"; color:var(--zone-color, var(--purple)); font-weight:800; font-size:1.05rem; flex-shrink:0;
  }
  .mineral.open .mineral-btn::after{content:"–";}
  .mineral-detail{
    max-height:0; overflow:hidden; transition:max-height 0.2s ease;
    border-top:1px solid transparent;
  }
  .mineral.open .mineral-detail{max-height:120px; border-top-color:var(--line);}
  .mineral-detail-inner{padding:10px 12px; font-size:0.82rem; color:var(--text-dim);}
  .mineral-detail-inner .row{display:flex; justify-content:space-between; margin-bottom:4px;}
  .mineral-detail-inner .row span:last-child{color:var(--white-glow); font-weight:700;}

  .path-controls{display:flex; justify-content:flex-end; margin-bottom:16px; max-width:1100px; margin-left:auto; margin-right:auto; padding:0 6vw;}
  .path-controls button{
    background:none; border:1px solid var(--line); color:var(--text-dim);
    padding:8px 16px; border-radius:var(--radius); font-family:var(--sans);
    font-size:0.85rem; font-weight:600; cursor:pointer; transition:border-color 0.2s, color 0.2s;
  }
  .path-controls button:hover{border-color:var(--blue); color:var(--white-glow);}

  /* Infinitium final card */
  .infinitium{
    position:relative;
    margin-top:28px;
    padding:34px 28px;
    text-align:center;
    border:1px solid rgba(255,220,150,0.35);
    border-radius:var(--radius);
    background:
      radial-gradient(ellipse at 50% 0%, rgba(255,200,255,0.12), transparent 70%),
      linear-gradient(135deg, rgba(122,47,224,0.15), rgba(79,179,255,0.12));
  }
  .infinitium h3{
    font-family:var(--serif); font-size:1.5rem; margin:0 0 8px;
    background:linear-gradient(90deg, var(--gold), #ff9de2, var(--blue));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .infinitium p{margin:0; color:var(--text-dim); max-width:50ch; margin:0 auto;}

  /* ---------- Equipment (grouped by zone, same accordion pattern as Zones) ---------- */
  .equip-zones{
    max-width:1100px; margin:0 auto; padding:10px 6vw 70px;
    position:relative; padding-left:calc(6vw + 26px);
  }
  .equip-zones::before{
    content:"";
    position:absolute; left:calc(6vw + 1px); top:6px; bottom:6px; width:2px;
    background:linear-gradient(180deg, #8a7660, #9b4bff 40%, #ffb347 70%, #ffe9a8);
    opacity:0.5;
  }
  .equip-zone{
    position:relative;
    margin-bottom:14px;
    border:1px solid var(--line);
    background:var(--bg-panel);
    border-radius:var(--radius);
  }
  .equip-zone::before{
    content:"";
    position:absolute; left:-26px; top:22px;
    width:12px; height:12px; border-radius:50%;
    background:var(--zone-color, var(--purple));
    box-shadow:0 0 12px var(--zone-color, var(--purple));
  }
  .equip-zone-head{
    display:flex; align-items:center; gap:16px;
    width:100%; text-align:left;
    padding:18px 20px;
    background:none; border:none; cursor:pointer;
    color:var(--text); font-family:var(--sans);
  }
  .equip-zone-num{
    font-family:var(--serif); font-weight:700; font-size:0.85rem;
    color:var(--zone-color, var(--purple));
    min-width:34px;
  }
  .equip-zone-name{font-weight:700; font-size:1.08rem; color:var(--white-glow); flex:1;}
  .equip-zone-chevron{color:var(--text-dim); font-size:1rem; transition:transform 0.2s; flex-shrink:0;}
  .equip-zone.open .equip-zone-chevron{transform:rotate(180deg);}
  .equip-zone-body{max-height:0; overflow:hidden; transition:max-height 0.3s ease;}
  .equip-zone.open .equip-zone-body{max-height:900px;}
  .equip-tiers{
    display:flex; flex-direction:column; gap:10px;
    padding:0 20px 20px 20px;
    border-top:1px solid var(--line);
    padding-top:16px;
  }
  .equip-tier-row{
    display:grid; grid-template-columns:30px 1fr 1fr; gap:14px; align-items:center;
    border:1px solid var(--line); background:var(--bg-panel-2); border-radius:var(--radius);
    padding:12px 14px;
  }
  @media (max-width:680px){
    .equip-tier-row{grid-template-columns:1fr; gap:8px;}
  }
  .equip-tier-label{
    font-family:var(--serif); font-weight:700; color:var(--zone-color, var(--purple));
    font-size:0.85rem;
  }
  .equip-item{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .equip-item .name{font-weight:700; color:var(--white-glow); font-size:0.88rem;}
  .equip-item .stat{color:var(--text-dim); font-size:0.8rem;}
  .equip-item .price{color:var(--gold); font-weight:700; font-size:0.85rem; white-space:nowrap;}
  .equip-header-row{
    display:grid; grid-template-columns:30px 1fr 1fr; gap:14px;
    max-width:1100px; margin:0 auto 8px; padding:0 6vw 0 calc(6vw + 26px);
    color:var(--text-dim); font-size:0.78rem; font-weight:700; letter-spacing:0.02em;
  }
  @media (max-width:680px){ .equip-header-row{display:none;} }

  /* ---------- Footer ---------- */
  footer{
    border-top:1px solid var(--line);
    padding:36px 6vw 50px;
    text-align:center;
    color:var(--text-dim);
    font-size:0.85rem;
  }
  footer a{text-decoration:underline; text-underline-offset:3px;}
  footer a:hover{color:var(--white-glow);}
</style>
</head>
<body>

<div class="stars" aria-hidden="true"></div>

<!-- Language gate -->
<div id="lang-gate">
  <div class="gate-inner">
    <img class="gate-logo" src="assets/cavernium-logo.webp" alt="Cavernium">
    <h1 class="gate-title">CAVERNIUM</h1>
    <p class="gate-sub" data-i18n-fixed>Choisissez votre langue · Choose your language</p>
    <div class="gate-buttons">
      <button class="gate-btn" data-lang="fr"><span class="gate-flag">🇫🇷</span> Français</button>
      <button class="gate-btn" data-lang="en"><span class="gate-flag">🇬🇧</span> English</button>
    </div>
  </div>
</div>

<div id="site" class="hidden">

  <header>
    <button class="brand" data-page="home" type="button">
      <img src="assets/cavernium-logo.webp" alt="Cavernium logo">
      <span>CAVERNIUM</span>
    </button>
    <nav>
      <div class="nav-links">
        <button class="nav-btn" data-page="home" data-i18n="nav.home"></button>
        <button class="nav-btn" data-page="zones" data-i18n="nav.zones"></button>
        <button class="nav-btn" data-page="equipment" data-i18n="nav.equipment"></button>
      </div>
      <button id="lang-toggle" type="button"></button>
    </nav>
  </header>

  <!-- ===== PAGE: HOME ===== -->
  <div class="page" id="page-home">
    <section id="hero">
      <div class="hero-copy">
        <p class="eyebrow-free" data-i18n="hero.eyebrow"></p>
        <h1 class="hero-title" data-i18n="hero.title"></h1>
        <p class="hero-desc" data-i18n="hero.desc"></p>
        <div class="hero-ctas">
          <a class="btn btn-primary" href="#" id="play-link" data-i18n="hero.cta_play"></a>
          <button class="btn btn-ghost" data-page="zones" data-i18n="hero.cta_zones"></button>
        </div>
      </div>
      <div class="hero-visual">
        <img src="assets/cavernium-logo.webp" alt="Cavernium">
      </div>
    </section>

    <section id="about">
      <div class="section-inner">
        <div class="section-head">
          <h2 data-i18n="about.title"></h2>
          <p data-i18n="about.desc"></p>
        </div>
        <div class="about-grid">
          <div class="about-card">
            <span class="num">21</span>
            <p data-i18n="about.card1"></p>
          </div>
          <div class="about-card">
            <span class="num">126+</span>
            <p data-i18n="about.card2"></p>
          </div>
          <div class="about-card">
            <span class="num">♾️</span>
            <p data-i18n="about.card3"></p>
          </div>
        </div>
      </div>
    </section>
  </div>

  <!-- ===== PAGE: ZONES ===== -->
  <div class="page hidden" id="page-zones">
    <div class="page-head">
      <h1 data-i18n="zones.title"></h1>
      <p data-i18n="zones.desc"></p>
    </div>
    <div class="notice">
      <div class="notice-inner" data-i18n="zones.notice"></div>
    </div>
    <div class="path-controls">
      <button id="toggle-all" data-i18n="zones.expand_all"></button>
    </div>
    <div class="path" id="path-container"></div>
  </div>

  <!-- ===== PAGE: EQUIPMENT ===== -->
  <div class="page hidden" id="page-equipment">
    <div class="page-head">
      <h1 data-i18n="equip.title"></h1>
      <p data-i18n="equip.desc"></p>

    const zoneTheme = lang === "fr" ? zone.themeFr : zone.themeEn;
    el.innerHTML = `
      <button class="zone-head" type="button" aria-expanded="false">
        <span class="zone-num">${String(i+1).padStart(2,"0")}</span>
        <span class="zone-icon">${zone.icon}</span>
        <span class="zone-titles">
          <span class="zone-name">${zoneName}</span>
          <span class="zone-theme">${zoneTheme}</span>
        </span>
        <span class="zone-chevron">⌄</span>
      </button>
      <div class="zone-body">
        <div class="zone-items">${itemsHtml}</div>
      </div>
    `;
    const head = el.querySelector(".zone-head");
    head.addEventListener("click", () => {
      const willOpen = !el.classList.contains("open");
      el.classList.toggle("open");
      head.setAttribute("aria-expanded", String(willOpen));
    });
    el.querySelectorAll(".mineral").forEach(mEl => {
      const btn = mEl.querySelector(".mineral-btn");
      btn.addEventListener("click", () => {
        const willOpen = !mEl.classList.contains("open");
        mEl.classList.toggle("open");
        btn.setAttribute("aria-expanded", String(willOpen));
      });
    });
    container.appendChild(el);
  });

  const infi = document.createElement("div");
  infi.className = "infinitium";
  infi.innerHTML = `
    <h3>♾️ ${I18N[lang]["infinitium.title"]}</h3>
    <p>${I18N[lang]["infinitium.desc"]}</p>
  `;
  container.appendChild(infi);
}

function renderEquipment(lang){
  const container = document.getElementById("equip-container");
  container.innerHTML = "";

  // group the 63 flat entries into their 21 zones
  const byZone = {};
  EQUIPMENT.forEach(e => {
    (byZone[e.zoneIndex] = byZone[e.zoneIndex] || []).push(e);
  });

  Object.keys(byZone).sort((a,b) => a-b).forEach(zoneIndexStr => {
    const zoneIndex = Number(zoneIndexStr);
    const tiers = byZone[zoneIndex];
    const first = tiers[0];
    const zoneName = lang === "fr" ? first.zoneNameFr : first.zoneNameEn;
    const zoneIcon = (ZONES[zoneIndex] && ZONES[zoneIndex].icon) || "⛏️";

    const el = document.createElement("div");
    el.className = "equip-zone";
    el.style.setProperty("--zone-color", first.color);

    const rowsHtml = tiers.map(t => {
      const pickName = lang === "fr" ? t.pickFr : t.pickEn;
      const bagName = lang === "fr" ? t.bagFr : t.bagEn;
      return `
        <div class="equip-tier-row">
          <span class="equip-tier-label">${String(t.subTier).padStart(2,"0")}</span>
          <div class="equip-item">
            <span class="name">⛏️ ${pickName}</span>
            <span class="stat">${I18N[lang]["equip.power"]} x${t.power}</span>
            <span class="price">${fmtNum(t.pickPrice)}</span>
          </div>
          <div class="equip-item">
            <span class="name">🎒 ${bagName}</span>
            <span class="stat">${I18N[lang]["equip.capacity"]} ${fmtNum(t.capacityKg)} kg</span>
            <span class="price">${fmtNum(t.bagPrice)}</span>
          </div>
        </div>`;
    }).join("");

    el.innerHTML = `
      <button class="equip-zone-head" type="button" aria-expanded="false">
        <span class="equip-zone-num">${String(zoneIndex+1).padStart(2,"0")}</span>
        <span class="zone-icon">${zoneIcon}</span>
        <span class="equip-zone-name">${zoneName}</span>
        <span class="equip-zone-chevron">⌄</span>
      </button>
      <div class="equip-zone-body">
        <div class="equip-tiers">${rowsHtml}</div>
      </div>
    `;
    const head = el.querySelector(".equip-zone-head");
    head.addEventListener("click", () => {
      const willOpen = !el.classList.contains("open");
      el.classList.toggle("open");
      head.setAttribute("aria-expanded", String(willOpen));
    });
    container.appendChild(el);
  });
}

function applyI18n(lang){
  currentLang = lang;
  document.getElementById("html-root").setAttribute("lang", lang);
  document.querySelectorAll("[data-i18n]").forEach(node => {
    const key = node.getAttribute("data-i18n");
    if (I18N[lang][key] !== undefined) node.innerHTML = I18N[lang][key];
  });
  document.getElementById("lang-toggle").textContent = lang === "fr" ? "EN" : "FR";
  document.getElementById("toggle-all").dataset.expanded = "false";
  document.getElementById("toggle-all").textContent = I18N[lang]["zones.expand_all"];
  document.getElementById("toggle-all-equip").dataset.expanded = "false";
  document.getElementById("toggle-all-equip").textContent = I18N[lang]["zones.expand_all"];
  document.getElementById("play-link").href = ROBLOX_LINK;
  document.getElementById("footer-play").href = ROBLOX_LINK;
  renderZones(lang);
  renderEquipment(lang);
}

function goToPage(page){
  currentPage = page;
  ["home","zones","equipment"].forEach(p => {
    document.getElementById("page-" + p).classList.toggle("hidden", p !== page);
  });
  document.querySelectorAll(".nav-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.page === page);
  });
  window.scrollTo({top:0, behavior:"instant"});
}

document.querySelectorAll(".gate-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const lang = btn.getAttribute("data-lang");
    document.getElementById("lang-gate").classList.add("hidden");
    document.getElementById("site").classList.remove("hidden");
    applyI18n(lang);
    goToPage("home");
  });
});

document.getElementById("lang-toggle").addEventListener("click", () => {
  applyI18n(currentLang === "fr" ? "en" : "fr");
});

document.querySelectorAll("[data-page]").forEach(el => {
  el.addEventListener("click", () => goToPage(el.dataset.page));
});

document.getElementById("toggle-all").addEventListener("click", function(){
  const expand = this.dataset.expanded !== "true";
  document.querySelectorAll(".zone").forEach(z => {
    z.classList.toggle("open", expand);
    z.querySelector(".zone-head").setAttribute("aria-expanded", String(expand));
  });
  this.dataset.expanded = String(expand);
  this.textContent = expand ? I18N[currentLang]["zones.collapse_all"] : I18N[currentLang]["zones.expand_all"];
});

document.getElementById("toggle-all-equip").addEventListener("click", function(){
  const expand = this.dataset.expanded !== "true";
  document.querySelectorAll(".equip-zone").forEach(z => {
    z.classList.toggle("open", expand);
    z.querySelector(".equip-zone-head").setAttribute("aria-expanded", String(expand));
  });
  this.dataset.expanded = String(expand);
  this.textContent = expand ? I18N[currentLang]["zones.collapse_all"] : I18N[currentLang]["zones.expand_all"];
});
</script>
</body>
</html>
